   <g id="text_1">
    <text style="font-size: 11.5px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: start; fill: #26353e" x="19.84252" y="31.605988" transform="rotate(-0 19.84252 31.605988)">看非编码 DNA：位置、来源与作用是三种不同的提问</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: start; fill: #2f6174" x="19.84252" y="79.228089" transform="rotate(-0 19.84252 79.228089)">按位置</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: middle; fill: #26353e" x="178.582677" y="79.086371" transform="rotate(-0 178.582677 79.086371)">基因内部：内含子等</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: middle; fill: #26353e" x="362.834646" y="79.086371" transform="rotate(-0 362.834646 79.086371)">基因之间的区域</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: start; fill: #6b8b7a" x="19.84252" y="144.42494" transform="rotate(-0 19.84252 144.42494)">按来源</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: middle; fill: #26353e" x="277.795276" y="144.283221" transform="rotate(-0 277.795276 144.283221)">重复序列；其中许多来自转座元件</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: middle; fill: #677278" x="277.795276" y="178.15725" transform="rotate(-0 277.795276 178.15725)">经典方法可识别的转座元件来源序列约占全基因组 45%</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: start; fill: #a6633f" x="19.84252" y="209.62179" transform="rotate(-0 19.84252 209.62179)">按作用</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: middle; fill: #26353e" x="180" y="209.480071" transform="rotate(-0 180 209.480071)">调控区域</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: middle; fill: #26353e" x="364.251969" y="209.480071" transform="rotate(-0 364.251969 209.480071)">产生非编码 RNA 的区域</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'Noto Sans SC', 'DejaVu Sans'; text-anchor: start; fill: #677278" x="19.84252" y="266.031266" transform="rotate(-0 19.84252 266.031266)">同一段 DNA 可以同时属于不同注释；框的面积与位置不代表全基因组比例。</text>
   </g>
  </g>
